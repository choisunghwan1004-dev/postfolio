<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로또 실습 · Plotly 인터랙티브 차트</title><style>body{font:16px/1.6 system-ui,"Malgun Gothic",sans-serif;margin:0;background:#f7faf8;color:#223c40}.wrap{max-width:1020px;margin:auto;padding:30px 20px}.card{background:white;border:1px solid #e1ebe7;border-radius:18px;padding:22px}h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.04em}a{color:#166a65}#chart{height:550px}.note{color:#59716e;font-size:14px}@media(max-width:600px){#chart{height:440px}}</style><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script></head><body><div class="wrap"><p><a href="./">← 로또 과제 실습관</a></p><h1>Plotly · 로또 당첨금과 1등 당첨자 수</h1><p class="note">과거 949~1248회 300회차. 점 위에 마우스를 올리면 회차·날짜·금액이 보입니다. 숫자 간 상관은 인과관계를 의미하지 않습니다.</p><div class="card"><div id="chart" role="img" aria-label="로또 과거 회차별 당첨금과 1등 당첨자 수 산점도">차트를 불러오는 중…</div></div><p class="note">출처: 사용자가 제공한 로또 기록 CSV 중 회차·당첨금·당첨자 수. Plotly 차트 스크립트는 외부 CDN에서 불러옵니다.</p></div><script>async function run(){try{const r=await fetch("data/lotto_949_1248_sales_prize.csv");if(!r.ok)throw Error("CSV "+r.status);const l=(await r.text()).trim().split(/\r?\n/),h=l.shift().split(",");const a=l.map(s=>{const v=s.split(",");return Object.fromEntries(h.map((k,i)=>[k,v[i]]))});if(!window.Plotly)throw Error("Plotly CDN 접속 불가");document.getElementById("chart").textContent="";await Plotly.newPlot("chart",[{type:"scatter",mode:"markers",x:a.map(x=>+x.firstPrzwnerCo),y:a.map(x=>+x.firstWinamnt/1e8),text:a.map(x=>x.drwNo+"회 / "+x.drwNoDate),hovertemplate:"%{text}<br>당첨자: %{x}명<br>1인 1등 지급액: %{y:.2f}억원<extra></extra>",marker:{size:9,color:"#329b8e",opacity:.65}}],{title:"1등 당첨자 수와 지급액 · 로또 300회차",xaxis:{title:"1등 당첨자 수(명)"},yaxis:{title:"1등 1인 지급액(억 원)"},margin:{l:65,r:25,t:65,b:65},paper_bgcolor:"#fff",plot_bgcolor:"#fff"}, {responsive:true,displaylogo:false})}catch(e){document.getElementById("chart").textContent="차트를 표시하지 못했습니다: "+e.message+" · CSV나 네트워크를 확인해 주세요."}}run()</script></body></html>
